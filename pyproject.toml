[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "acbotics_pipeline"
version = "1.1.0"
dependencies = [
	"scipy",
	"numpy",
	"matplotlib",
	"pandas-stubs",
	"icontract",
	"pyprctl",
	"future",
	"pandas",
	"mlsocket",
	"netifaces",
	"Cython",
	"soundfile",
	"pyaudio",
	#"arlpy",	
	"cryptocode"
	#"gps",
	# "geotiff",
	# "imagecodecs",
	# "PySide2",
	#"pyqtgraph",
	# "acbotics_interface",
]

# pyproject.toml
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

#[tool.setuptools.packages]
#find = {}  # Scanning implicit namespaces is active by default

[project.scripts]
run-acsense-cpp-logger = "acbotics_pipeline.scripts.fixture_cpp_logger:run"
